:root{--ct-grad:linear-gradient(90deg,#ff7a18,#ffc23d 45%,#22c5b4)}
html,body{background:#000!important;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
section,[data-section]{background:#1c1c1e;border:none;border-radius:20px;padding:16px;margin:0}
.ct-card{background:#1c1c1e;border:none;border-radius:20px;padding:16px;margin:0}
.ct-stack{display:flex;flex-direction:column;gap:12px}
.ct-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct-htitle{margin:0;font-size:34px;font-weight:800;letter-spacing:-.4px;color:#fff;line-height:1.05}
body h1:not(.ct-htitle){font-size:34px!important;font-weight:800!important;letter-spacing:-.4px!important;line-height:1.05!important;color:#fff!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
body h1:not(.ct-htitle)+div .ct-gear{margin-top:2px}
.ct-hsub{margin:4px 0 0;font-size:13px;color:#8e8e93;font-weight:500}
.ct-chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.ct-ctitle{margin:0;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px}
.ct-chev{flex:none;width:28px;height:28px;border-radius:14px;border:none;background:rgba(255,255,255,.08);color:rgba(235,235,245,.55);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ct-pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 0 8px}
.ct-hide-page>h1,.ct-hide-page [data-page-title],.ct-hide-page>header h1{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ct-hide-page>p:first-of-type,.ct-hide-page [data-page-summary]{display:none!important}
.ct-bigval{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.05;font-variant-numeric:tabular-nums}
.ct-edg{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.ct-big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px;background:var(--ct-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ct-sub{color:#9a9a9a;font-size:13px}
.ct-bar{height:10px;border-radius:999px;background:#262626;overflow:hidden}.ct-bar.slim{height:6px}
.ct-bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ct-ic{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #262626;background:#161616;color:#ddd;font-size:18px;cursor:pointer;transition:transform .1s,background .2s}
