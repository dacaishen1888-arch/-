:root{--ct-grad:linear-gradient(90deg,#ff7a18,#ffc23d 45%,#22c5b4)}

section,[data-section]{background:#1c1c1e;border:none;border-radius:20px;padding:16px;margin:0}

.ct-stack{display:flex;flex-direction:column;gap:12px}
.ct-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

body h1:not(.ct-htitle){font-size:34px!important;font-weight:800!important;letter-spacing:-.4px!important;line-height:1.05!important;color:#fff!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
body h1:not(.ct-htitle)+div .ct-gear{margin-top:2px}
.ct-hsub{margin:4px 0 0;font-size:13px;color:#8e8e93;font-weight:500}
.ct-chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.ct-ctitle{margin:0;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px}
.ct-chev{flex:none;width:28px;height:28px;border-radius:14px;border:none;background:rgba(255,255,255,.08);color:rgba(235,235,245,.55);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ct-pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 0 8px}
.ct-hide-page>h1,.ct-hide-page [data-page-title],.ct-hide-page>header h1{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ct-hide-page>p:first-of-type,.ct-hide-page [data-page-summary]{display:none!important}
.ct-bigval{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.05;font-variant-numeric:tabular-nums}
.ct-edg{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.ct-big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px;background:var(--ct-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ct-sub{color:#9a9a9a;font-size:13px}
.ct-bar{height:10px;border-radius:999px;background:#262626;overflow:hidden}.ct-bar.slim{height:6px}
.ct-bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ct-ic{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #262626;background:#161616;color:#ddd;font-size:18px;cursor:pointer;transition:transform .1s,background .2s}
button:active,.ct-row:active{transform:scale(.97);opacity:.85}
.ct-row{display:flex;gap:8px;transition:background .15s}.ct-row:hover{background:#1a1a1a}
.ct-fab{position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:none;background:var(--ct-grad);color:#000;font-size:30px;font-weight:700;box-shadow:0 8px 24px rgba(255,140,40,.35);z-index:55;cursor:pointer}
.ct-tabbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom)*0.5 + 8px);width:auto;margin:0;border-radius:32px;z-index:50;box-sizing:border-box;min-height:64px;padding:6px 8px;background:rgba(40,40,44,.45);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:.5px solid rgba(255,255,255,.12);box-shadow:0 10px 32px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.08)}
.ct-tabbar::before{content:none;display:none}
.ct-hump{display:none}
.ct-hump-line{display:none}
.ct-tab{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:rgba(255,255,255,.55);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;border-radius:22px;padding:4px 6px}.ct-tab-i{font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}.ct-tab.on{color:#fff;font-weight:700;background:rgba(255,255,255,.12)}.ct-tab.on .ct-tab-i{filter:none;opacity:1}
.ct-tb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid #34373c;background:#1f1f1f;color:#fff;font-size:18px;cursor:pointer;touch-action:manipulation}.ct-tb-del{border-color:#5a2326;background:#2a1416}
.ct-tabbar::after{content:none;display:none}
.ct-cfab{position:relative;left:auto;top:auto;transform:none;z-index:2;width:52px;height:52px;margin:0 auto;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:0;border:none;background:linear-gradient(135deg,#ffe14d,#ff9f0a);color:#000;font-size:28px;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(255,159,10,.35);cursor:pointer;touch-action:manipulation}.ct-cfab:active{transform:scale(.94)}
.ct-atoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom)*0.5);z-index:70;display:flex;align-items:center;gap:12px;width:calc(100vw - 32px);max-width:420px;justify-content:space-between;box-sizing:border-box;padding:10px 10px 10px 16px;border-radius:14px;background:#2c2c2e;border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:ctT .25s ease-out}.ct-atoast span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct-atoast button{flex:none;min-height:36px;padding:0 12px;border:none;border-radius:10px;background:rgba(255,176,32,.18);color:#ffb020;font-size:15px;font-weight:700;cursor:pointer}
@keyframes ctT{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.ct-strip{position:sticky;top:env(safe-area-inset-top);z-index:30;background:#111113;border:1px solid #26262a;border-radius:14px;padding:8px 12px;font-size:13px;color:#eee;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px}
.ct-sbar{height:4px;border-radius:2px;background:rgba(255,45,85,.18);overflow:hidden}.ct-sbar>div{height:100%;border-radius:2px;transition:width .5s}
.ct-sbtn{min-height:28px;padding:0 8px;border-radius:8px;border:1px solid #333;background:#1c1c1e;color:#ddd;font-size:12px;cursor:pointer}
.ct-sess{display:flex;flex-direction:column;max-height:30vh;overflow-y:auto}.ct-sess>div{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;border-top:1px solid #222}.ct-sess button{width:32px;height:32px;border:none;background:none;color:#8e8e93;font-size:15px;cursor:pointer}
.ct-hl{animation:ctH 1.4s ease-out}@keyframes ctH{0%,30%{background:rgba(255,176,32,.25)}100%{background:transparent}}
.ct-ib{flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:16px;border:.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:rgba(235,235,245,.6);cursor:pointer;-webkit-tap-highlight-color:transparent}.ct-ib:active{background:rgba(255,255,255,.16)}.ct-ib.on{background:rgba(146,232,42,.18);border-color:rgba(146,232,42,.4);color:#92e82a}
.ct-ws{display:flex;flex-direction:column;gap:12px}.ct-sub{font-size:13px;color:#8e8e93;font-weight:600;letter-spacing:.5px}
.ct-wbar{height:8px;border-radius:4px;background:rgba(30,234,239,.14);overflow:hidden}.ct-wbar>div{height:100%;border-radius:4px;background:linear-gradient(90deg,#0a84ff,#1eeaef);transition:width .4s}
.ct-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ct-pill{display:flex;align-items:center;justify-content:center;gap:4px;height:40px;min-width:0;box-sizing:border-box;padding:0 10px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#eee;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}.ct-pill:active{background:rgba(255,255,255,.12)}
